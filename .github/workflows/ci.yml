# Manual CI for the Infer Swift package.
#
# Trigger is workflow_dispatch ONLY (run it from the Actions tab / `gh
# workflow run ci.yml`). It downloads the ~840 MB Metal Toolchain and
# compiles the full package graph, so it does not run on every commit.
name: CI

on:
  workflow_dispatch:

# A new manual run supersedes an in-flight one on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (macos-26)
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # mlx-swift's manifest needs Swift 6.3 (Xcode 26+), so macos-26 is the
      # oldest usable image. Its default Xcode is used as is.
      # MLX and SwiftTerm compile Metal shaders at build time, which needs
      # this separate component (not preinstalled on runners).
      - name: Download Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Fetch ggml stack
        run: make fetch-stack

      # Vendored SwiftPM source deps (patched SQLiteVec + tree-sitter grammars).
      - name: Fetch vendored source dependencies
        run: make fetch-sqlitevec fetch-tree-sitter-qmd fetch-tree-sitter-python

      # Fast path: every non-External suite. Builds the whole package
      # graph (including the MLX-linked Infer target) and runs the unit /
      # cross-module tests.
      - name: Run fast tests
        run: make test

      # Integration path: the *ExternalTests suites, including
      # LlamaTemplateExternalTests, which exercise the real chatfmt bridge.
      # Network/binary-dependent suites (web search, Quarto) auto-skip
      # when their dependency is absent.
      - name: Run integration tests
        run: make test-integration
